allowBuilds:
    "@parcel/watcher": false
    esbuild: false
    msgpackr-extract: false
    puppeteer: true

overrides:
    "vite@*": npm:@voidzero-dev/vite-plus-core@0.3.0
    "vitest@*": 4.1.11
    # Security fixes for versions pinned by upstream dependencies.
    "qs@<6.16.0": 6.16.0
    "linkify-it@<5.0.2": 5.0.2
    "extract-zip@<2.0.2": 2.0.2

peerDependencyRules:
    allowedVersions:
        vitest: 4.1.11
        vite: 0.3.0

packages:
    - packages/lib
    - packages/mermaid-electron-renderer
    - packages/mermaid-puppeteer-renderer
    - packages/plantuml-renderer
    - packages/cli
    - packages/obsidian

patchedDependencies:
    image-size@2.0.2: patches/image-size@2.0.2.patch
