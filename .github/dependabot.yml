version: 2
updates:
  # The root pnpm workspace owns every package manifest and the shared lockfile.
  # Separate package-directory jobs produce manifest-only PRs without that lockfile.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      effect:
        patterns:
          - "effect"
          - "@effect/*"
      atlaskit:
        patterns:
          - "@atlaskit/*"
    commit-message:
      prefix: deps
      prefix-development: deps-dev
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
      prefix-development: deps-dev
      include: scope

  - package-ecosystem: docker
    directory: /packages/cli
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
      prefix-development: deps-dev
      include: scope
