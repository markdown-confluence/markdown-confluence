name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing root release tag to finish publishing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/markdown-confluence/publish

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.release.outputs.tag_name }}
      created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: >-
      always() &&
      ((needs.release-please.result == 'success' && needs.release-please.outputs.created == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24.15.0"
          cache: false
          run-install: false
      - name: Verify release identity
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_TAG" == "obsidian-confluence-root-v$version" ]]
          git merge-base --is-ancestor HEAD origin/main
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Validate and build the complete release
        run: |
          vp run check
          vp run fmt:check
          vp test run
          vp run build
          vp run release:prepare
      - name: Verify the npm tarballs before publication
        run: vp run test:integration packages --skip-build
      - name: Upload package verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-release-packages
          path: reports/integration/
          if-no-files-found: ignore
      - name: Publish npm packages
        run: vp pm publish -r --filter '@markdown-confluence/*' --access public --no-git-checks
      - name: Log in to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Check for an already published image
        id: image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect --raw "$IMAGE_NAME:$VERSION" > "$RUNNER_TEMP/release-image.json"; then
            jq -e --arg sha "$RELEASE_SHA" '
              .annotations["org.opencontainers.image.revision"] == $sha and
              ([.manifests[].platform | select(.os == "linux") | .architecture] | index("amd64") != null and index("arm64") != null)
            ' "$RUNNER_TEMP/release-image.json"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push both container architectures
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: packages/cli
          platforms: linux/amd64,linux/arm64
          push: true
          annotations: index:org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.major }}
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.minor }}
            ${{ env.IMAGE_NAME }}:latest
      - name: Checkout Obsidian distribution repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: markdown-confluence/obsidian-integration
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
          path: .release-repo
      - name: Publish verified Obsidian assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_PAT }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: ./.build/upload-release-assets.sh "$RELEASE_TAG" "$RELEASE_SHA"
