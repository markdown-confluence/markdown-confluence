name: Confluence End-to-End Verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: confluence-release-e2e
  cancel-in-progress: false
jobs:
  published-action:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ATLASSIAN_USERNAME: ${{ secrets.ATLASSIAN_USERNAME }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
    steps:
      - name: Checkout synthetic fixtures
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Prepare dedicated test space and fixtures
        run: python3 scripts/verify-published-action.py prepare
      - name: Publish create with the released Action
        uses: markdown-confluence/publish-action@v6.0.0
        with:
          confluenceBaseUrl: https://markdown-confluence.atlassian.net
          confluenceParentId: "986448062"
          atlassianUserName: ${{ secrets.ATLASSIAN_USERNAME }}
          atlassianApiToken: ${{ secrets.ATLASSIAN_API_TOKEN }}
          contentRoot: /github/workspace/action-test-vault
          folderToPublish: Release Tests
          configFile: /github/workspace/action-test-vault/.markdown-confluence.json
          tagsToPublish: release-test
          mermaidProtocolTimeout: "600000"
          plantumlEnabled: "true"
          plantumlServerUrl: https://www.plantuml.com/plantuml
      - name: Verify create through the Confluence API
        run: python3 scripts/verify-published-action.py create
      - name: Publish unchanged with the released Action
        uses: markdown-confluence/publish-action@v6.0.0
        with:
          confluenceBaseUrl: https://markdown-confluence.atlassian.net
          confluenceParentId: "986448062"
          atlassianUserName: ${{ secrets.ATLASSIAN_USERNAME }}
          atlassianApiToken: ${{ secrets.ATLASSIAN_API_TOKEN }}
          contentRoot: /github/workspace/action-test-vault
          folderToPublish: Release Tests
          configFile: /github/workspace/action-test-vault/.markdown-confluence.json
          tagsToPublish: release-test
          mermaidProtocolTimeout: "600000"
          plantumlEnabled: "true"
          plantumlServerUrl: https://www.plantuml.com/plantuml
      - name: Verify unchanged through the Confluence API
        run: python3 scripts/verify-published-action.py unchanged
      - name: Modify one note
        run: python3 scripts/verify-published-action.py modify
      - name: Publish update with the released Action
        uses: markdown-confluence/publish-action@v6.0.0
        with:
          confluenceBaseUrl: https://markdown-confluence.atlassian.net
          confluenceParentId: "986448062"
          atlassianUserName: ${{ secrets.ATLASSIAN_USERNAME }}
          atlassianApiToken: ${{ secrets.ATLASSIAN_API_TOKEN }}
          contentRoot: /github/workspace/action-test-vault
          folderToPublish: Release Tests
          configFile: /github/workspace/action-test-vault/.markdown-confluence.json
          tagsToPublish: release-test
          mermaidProtocolTimeout: "600000"
          plantumlEnabled: "true"
          plantumlServerUrl: https://www.plantuml.com/plantuml
      - name: Verify update through the Confluence API
        run: python3 scripts/verify-published-action.py update
