name: Confluence End-to-End Verification

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: confluence-release-e2e
  cancel-in-progress: false

jobs:
  publish-and-verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'run-confluence-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24.15.0"
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Publish synthetic fixtures and verify create, unchanged and update behavior
        run: vp run test:integration live
        env:
          ATLASSIAN_USERNAME: ${{ secrets.ATLASSIAN_USERNAME }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          CONFLUENCE_E2E_BASE_URL: https://markdown-confluence.atlassian.net
          CONFLUENCE_E2E_PARENT_ID: "986448062"
          CONFLUENCE_E2E_SPACE_KEY: MCRT20260907
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-confluence
          path: reports/integration/
          if-no-files-found: ignore
